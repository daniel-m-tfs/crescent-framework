# Development configuration. Start with:
#   openresty -p "$PWD/" -c nginx.conf
worker_processes 1;
error_log logs/error.log notice;
pid logs/openresty.pid;

# nginx clears the environment of worker processes; every variable read by
# the application (crescent.env) must be listed here.
env APP_ENV;
env APP_KEY;
env APP_DEBUG;
env DB_HOST;
env DB_PORT;
env DB_NAME;
env DB_TEST_NAME;
env DB_USER;
env DB_PASSWORD;
env JWT_SECRET;
env PASSWORD_HASH_ITERATIONS;
env SMTP_SERVER;
env SMTP_PORT;
env SMTP_USER;
env SMTP_PASSWORD;
env SMTP_FROM;
env SMTP_FROM_NAME;

events {
    worker_connections 1024;
}

http {
    log_format crescent '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                        '$request_time rid=$request_id';
    access_log logs/access.log crescent;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10m;
    client_body_buffer_size 1m;
    client_body_temp_path tmp/client_body;
    proxy_temp_path tmp/proxy;
    fastcgi_temp_path tmp/fastcgi;
    uwsgi_temp_path tmp/uwsgi;
    scgi_temp_path tmp/scgi;

    lua_package_path "$prefix/?.lua;$prefix/?/init.lua;$prefix/lua_modules/share/lua/5.1/?.lua;$prefix/lua_modules/share/lua/5.1/?/init.lua;;";
    lua_package_cpath "$prefix/lua_modules/lib/lua/5.1/?.so;;";
    # Reload Lua modules on every request in development.
    lua_code_cache off;

    lua_shared_dict crescent_limits 10m;
    lua_shared_dict crescent_jwt 5m;
    lua_shared_dict crescent_sessions 10m;

    # Outbound cosockets (crescent.http_client, crescent.mail) need DNS and a
    # CA bundle; `local=on` reads /etc/resolv.conf. Linux CA path:
    # /etc/ssl/certs/ca-certificates.crt
    resolver local=on ipv6=off;
    lua_ssl_trusted_certificate /etc/ssl/cert.pem;
    lua_ssl_verify_depth 3;

    server {
        listen 8080;
        server_name _;

        location /public/ {
            alias public/;
        }

        location / {
            content_by_lua_block {
                require("app"):run()
            }
        }
    }
}
