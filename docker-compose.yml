# Development stack: the app with live code reload (lua_code_cache off) and
# MySQL. Copy .env.example to .env first; `docker compose up --build`.
services:
  app:
    build: .
    env_file: .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      NGINX_CONF: ${NGINX_CONF:-conf/nginx.docker-dev.conf}
      DB_HOST: mysql
      DB_PORT: "3306"
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      # Source is mounted for live reload; dependencies, logs and temp files
      # stay in the container; uploads persist in the app-storage volume.
      - .:/app
      - /app/lua_modules
      - /app/logs
      - /app/tmp
      - app-storage:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      DB_TEST_NAME: ${DB_TEST_NAME}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  app-storage:
  mysql-data:
