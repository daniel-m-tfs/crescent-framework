# Development container configuration (docker-compose.yml): Lua modules
# are reloaded on every request, so edits under the mounted source apply
# without restarting.
# Started by docker/entrypoint.sh with `-g 'daemon off;'`; logs go to the
# container's stdout/stderr.
worker_processes 1;
error_log /dev/stderr notice;
pid tmp/openresty.pid;

env APP_ENV;
env APP_DEBUG;
env APP_KEY;
env DB_HOST;
env DB_PORT;
env DB_NAME;
env DB_TEST_NAME;
env DB_USER;
env DB_PASSWORD;
env JWT_SECRET;
env PASSWORD_HASH_ITERATIONS;
env SMTP_SERVER;
env SMTP_PORT;
env SMTP_USER;
env SMTP_PASSWORD;
env SMTP_FROM;
env SMTP_FROM_NAME;
env REDIS_HOST;
env REDIS_PORT;
env REDIS_PASSWORD;
env REDIS_DB;
env CACHE_DRIVER;
env QUEUE_DRIVER;

events {
    worker_connections 4096;
}

http {
    log_format crescent escape=json '{"time":"$time_iso8601","rid":"$request_id",'
        '"remote":"$remote_addr","method":"$request_method","uri":"$uri",'
        '"status":$status,"bytes":$body_bytes_sent,"duration":$request_time}';
    access_log /dev/stdout crescent;
    # Content-Type by extension for static files (/public/): without it every
    # file is application/octet-stream and browsers ignore CSS and JS.
    include mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30;
    client_max_body_size 10m;
    client_body_buffer_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    client_body_temp_path tmp/client_body;
    proxy_temp_path tmp/proxy;
    fastcgi_temp_path tmp/fastcgi;
    uwsgi_temp_path tmp/uwsgi;
    scgi_temp_path tmp/scgi;

    # Behind a load balancer/reverse proxy, trust its X-Forwarded-For:
    # set_real_ip_from 10.0.0.0/8;
    # real_ip_header X-Forwarded-For;
    # real_ip_recursive on;

    lua_package_path "$prefix/?.lua;$prefix/?/init.lua;$prefix/lua_modules/share/lua/5.1/?.lua;$prefix/lua_modules/share/lua/5.1/?/init.lua;;";
    lua_package_cpath "$prefix/lua_modules/lib/lua/5.1/?.so;;";
    lua_code_cache off;
    lua_shared_dict crescent_limits 10m;
    lua_shared_dict crescent_jwt 5m;
    lua_shared_dict crescent_sessions 10m;
    # crescent.cache / crescent.queue "shared" drivers (one server's memory).
    lua_shared_dict crescent_cache 32m;
    lua_shared_dict crescent_queue 16m;

    # Outbound cosockets (crescent.http_client, crescent.mail): Docker's DNS
    # comes from /etc/resolv.conf; the CA bundle is Alpine's.
    resolver local=on ipv6=off valid=60s;
    resolver_timeout 5s;
    lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    lua_ssl_verify_depth 3;

    # Queue workers embedded in each nginx worker (config.queue.workers.embedded).
    init_worker_by_lua_block {
        require("app"):start_workers()
    }

    server {
        listen 8080;
        server_name _;

        location /public/ {
            alias public/;
            expires off;
            access_log off;
        }

        location / {
            content_by_lua_block {
                require("app"):run()
            }
        }
    }
}
